
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -d src/web
          test -d src/mobile
          test -d src/backend
          test -d tests
          test -d features
          test -d docs/project
          test -f README.md

      - name: Repository validation passed
        run: echo "GradTrack structure verified."

  backend-checks:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradtrack_test
          POSTGRES_USER: gradtrack_test
          POSTGRES_PASSWORD: gradtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradtrack_test -d gradtrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRADTRACK_DATABASE_URL: postgresql+psycopg://gradtrack_test:gradtrack_test@localhost:5432/gradtrack_test
      GRADTRACK_AUTH_SECRET_KEY: synthetic-only-gradtrack-auth-test-key-32-bytes-minimum
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply backend migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest

      - name: Run backend lint and formatting checks
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
