
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -d src/web
          test -d src/mobile
          test -d src/backend
          test -d tests
          test -d features
          test -d docs/project
          test -f README.md

      - name: Repository validation passed
        run: echo "GradTrack structure verified."

  backend-checks:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest

      - name: Run backend lint and formatting checks
        run: |
          ruff check app tests
          ruff format --check app tests
